[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "localai-steer"
version = "0.1.0"
description = "Claude-CLI-style mid-run steering for LocalAI agents (M0: one-shot turn)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "L0ria", email = "loria@hno3.eu" }]
keywords = ["localai", "agents", "steering", "cli", "sse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27,<1",
    "click>=8.1,<9",
    "rich>=13,<14",
    # Declared for M2's live input line; not imported by M0 code.
    "prompt_toolkit>=3.0.43,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[project.scripts]
localai-steer = "localai_steer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/localai_steer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
